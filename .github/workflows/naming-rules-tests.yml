name: Naming rules tests

on:
  pull_request:
    paths:
      - "scripts/ResourceName*.psm1"
      - "scripts/*-ResourceNameRules.ps1"
      - "scripts/tests/**"
      - "data/resource-name-rules*.json"
      - ".github/workflows/update-resource-name-rules.yml"
      - ".github/workflows/naming-rules-tests.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/ResourceName*.psm1"
      - "scripts/*-ResourceNameRules.ps1"
      - "scripts/tests/**"
      - "data/resource-name-rules*.json"
      - ".github/workflows/update-resource-name-rules.yml"
      - ".github/workflows/naming-rules-tests.yml"
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the proposed code without persisting credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Test parser and mocked publication without network or Azure access
        run: .\scripts\tests\Test-ResourceNameRules.ps1
