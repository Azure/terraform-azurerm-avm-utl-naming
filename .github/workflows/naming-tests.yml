name: Naming tests

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  naming:
    name: Naming behavior
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the module
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install AVM authoring
        run: |
          Install-PSResource -Name Avm.Authoring -Repository PSGallery -TrustRepository
          Import-Module Avm.Authoring
          avm version

      - name: Check naming behavior
        run: |
          Import-Module Avm.Authoring
          avm test unit
