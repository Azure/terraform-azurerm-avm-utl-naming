name: Naming compatibility

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Naming interface and state compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the module
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install AVM authoring
        run: |
          Install-PSResource -Name Avm.Authoring -Repository PSGallery -TrustRepository
          Import-Module Avm.Authoring
          avm version

      - name: Check the legacy interface and naming behavior
        run: |
          Import-Module Avm.Authoring
          avm test unit

      - name: Check a state-preserving upgrade from the legacy module
        run: ./tests/compatibility/Test-LegacyUpgrade.ps1
