name: Discover naming rule additions

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: resource-name-rules-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'Azure/terraform-azurerm-avm-utl-naming' &&
      !github.event.repository.fork &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test parser and mocked publication
        run: .\scripts\tests\Test-ResourceNameRules.ps1
      - name: Discover additions and create or update the review pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NAMING_RULES_BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: .\scripts\Publish-ResourceNameRules.ps1
